[project]
name = "pawmind-api"
version = "0.1.0"
description = "PawMind — FastAPI + LangChain veterinary assistant API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "langgraph>=0.2.0",
  "openai>=1.55.0",
  "notion-client>=2.2.0",
  "qdrant-client>=1.12.0",
  "httpx>=0.27.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "tiktoken>=0.8.0",
]

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.uv]
package = false
